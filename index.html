



<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
   
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<title>موی کلوپ | کلوب فیلم‌های عجیب</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}

:root{
  --bg:#0d0d0f;
  --surface:#161618;
  --surface-2:#1e1e22;
  --border:rgba(255,255,255,.08);
  --text:#e5e5e7;
  --text-strong:#fafafa;
  --muted:#8a8a92;
  --accent:#dc2626;
  --accent-soft:#ef4444;
  --accent-deep:#991b1b;
  --grad:linear-gradient(135deg,#dc2626,#991b1b);
  --grad-soft:linear-gradient(135deg,#ef4444,#dc2626);
  --turquoise:#dc2626;
  --turquoise-soft:#ef4444;
  --purple:#991b1b;
  --purple-soft:#ef4444;
  }

html,body{background:var(--bg)}
body{
  background:
    radial-gradient(circle at 0% 0%,rgba(220,38,38,.10),transparent 45%),
    radial-gradient(circle at 100% 15%,rgba(124,58,237,.14),transparent 50%),
    var(--bg);
  color:var(--text);
  padding-bottom:80px;
  min-height:100vh;
}

header{
  background:rgba(11,18,32,.92);
  backdrop-filter:blur(10px);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  border-bottom:1px solid var(--border);
  z-index:10;
  box-shadow:0 2px 14px rgba(0,0,0,.4);
}
.logo{
  font-weight:bold;
  font-size:16px;
  background:var(--grad-soft);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  cursor:pointer; 
  font-family:'Cinzel',serif;
font-weight:700;
letter-spacing:2px;
}
.search{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 12px;
  color:var(--muted);
  font-size:12px;
  outline:none;
}
.search::placeholder{color:var(--muted)}
.login{
  background:var(--grad);
  color:#eef4fb;
  padding:8px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 2px 10px rgba(124,58,237,.35);
  cursor:pointer;
}

nav.top-nav{
  background:rgba(11,18,32,.85);
  padding:10px 14px;
  display:flex;
  gap:16px;
  overflow-x:auto;
  font-size:13px;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
nav.top-nav::-webkit-scrollbar{display:none}
nav.top-nav span{
  white-space:nowrap;
  padding-bottom:4px;
  cursor:pointer;
  transition:.2s;
}
nav.top-nav span.active{
  background:var(--grad-soft);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  font-weight:bold;
  border-bottom:2px solid var(--turquoise);
}
nav.top-nav span.admin-link{
  color:#991b1b;
  font-weight:bold;
}

.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.hero{
  margin:14px;
  border-radius:18px;
  padding:26px 20px;
  background:
    linear-gradient(135deg,rgba(153,27,27,.35),rgba(76,29,149,.55)),
    #0f172a;
  border:1px solid var(--border);
  color:#eef4fb;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;top:-40px;left:-40px;
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(220,38,38,.28),transparent 70%);
  border-radius:50%;
}
.hero::after{
  content:"";
  position:absolute;bottom:-60px;right:-60px;
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(167,139,250,.22),transparent 70%);
  border-radius:50%;
}
.hero-badge{
  background:rgba(220,38,38,.12);
  color:var(--turquoise-soft);
  padding:5px 12px;
  border-radius:12px;
  font-size:11px;
  display:inline-block;
  margin-bottom:12px;
  border:1px solid rgba(220,38,38,.35);
  position:relative;z-index:1;
}
.hero h1{
  font-size:24px;margin-bottom:8px;
  color:var(--text-strong);
  position:relative;z-index:1;
}
.hero p{
  color:#b8c4d6;font-size:12px;margin-bottom:4px;
  position:relative;z-index:1;
}
.hero-tag{
  display:inline-block;
  background:rgba(167,139,250,.12);
  padding:3px 10px;
  border-radius:8px;
  font-size:11px;
  margin:2px 2px 0 0;
  color:var(--purple-soft);
  border:1px solid rgba(167,139,250,.3);
}
.hero-btns{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}

.btn{
  padding:11px 20px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  border:none;
  cursor:pointer;
  font-family:Tahoma,sans-serif;
}
.btn-play{
  background:var(--grad);
  color:#eef4fb;
  box-shadow:0 4px 16px rgba(153,27,27,.35);
}
.btn-list{
  background:rgba(220,38,38,.08);
  color:var(--turquoise-soft);
  border:1px solid rgba(220,38,38,.35);
}
.btn-small{padding:8px 14px;font-size:12px}

.section{padding:0 14px;margin-bottom:24px}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.section-head h2{
  font-size:16px;color:var(--text-strong);
  display:flex;align-items:center;gap:8px;
}
.section-head h2::before{
  content:"";
  width:4px;height:16px;border-radius:4px;
  background:var(--grad-soft);
  display:inline-block;
}
.section-head a{
  color:var(--purple-soft);
  font-size:12px;font-weight:bold;
  cursor:pointer;
}

.row{
  display:flex;gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}
.row::-webkit-scrollbar{display:none}

.card{
  min-width:140px;
  background:var(--surface);
  border-radius:12px;
  overflow:hidden;
  flex-shrink:0;
  box-shadow:0 3px 16px rgba(0,0,0,.5);
  border:1px solid var(--border);
  position:relative;
  transition:.25s;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(220,38,38,.5);
  box-shadow:0 10px 26px rgba(153,27,27,.18),0 0 0 1px rgba(167,139,250,.25);
}
.card img{
  width:100%;height:200px;
  object-fit:cover;display:block;
  background:linear-gradient(160deg,#1a2438,#0f172a);
  filter:contrast(1.02) saturate(.9) brightness(.92);
  transition:.3s;
}
.card:hover img{
  filter:contrast(1.05) saturate(1) brightness(1);
}
.card-info{padding:8px}
.card-info b{
  font-size:12px;display:block;margin-bottom:4px;
  color:var(--text-strong);line-height:1.3;
}
.card-info small{
  color:var(--turquoise);
  font-size:11px;font-weight:bold;
} 
  .genre-chip{
  display:inline-block;
  background:rgba(167,139,250,.15);
  color:var(--purple-soft);
  border:1px solid rgba(167,139,250,.4);
  padding:2px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:bold;
  margin-top:4px;
  }
.card-badge{
  position:absolute;top:6px;right:6px;
  background:rgba(153,27,27,.85);
  color:#eef4fb;
  font-size:9px;padding:3px 7px;
  border-radius:8px;font-weight:bold;
  backdrop-filter:blur(4px);z-index:2;
}
.card-progress{
  position:absolute;bottom:0;left:0;right:0;
  height:4px;background:rgba(255,255,255,.1);
}
.card-progress span{
  display:block;height:100%;
  background:var(--grad-soft);
}

.quote{
  background:var(--surface);
  padding:14px 16px;border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.quote::before{
  content:"";
  position:absolute;top:0;right:0;bottom:0;
  width:4px;background:var(--grad-soft);
}
.quote p{
  font-size:13px;color:#c2cbdb;
  line-height:1.7;margin-bottom:6px;
}
.quote .user{color:var(--turquoise);font-size:11px;font-weight:bold}
.quote .film{font-size:10px;color:var(--muted)}

.genres{display:flex;flex-wrap:wrap;gap:8px}
.genre{
  background:var(--surface);
  border:1.5px solid rgba(220,38,38,.45);
  color:var(--turquoise-soft);
  padding:8px 16px;
  border-radius:18px;
  font-size:12px;font-weight:bold;
  cursor:pointer;transition:.2s;
}
.genre:nth-child(even){
  border-color:rgba(167,139,250,.45);
  color:var(--purple-soft);
}
.genre:hover{
  background:var(--grad);
  color:#eef4fb;
  border-color:transparent;
}

.profile-head{
  margin:14px;
  border-radius:18px;
  padding:24px 20px;
  background:
    linear-gradient(135deg,rgba(153,27,27,.35),rgba(76,29,149,.55)),
    #0f172a;
  border:1px solid var(--border);
  text-align:center;
}
.avatar{
  width:82px;height:82px;border-radius:50%;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:38px;margin:0 auto 12px;
  border:3px solid rgba(220,38,38,.4);
  box-shadow:0 6px 24px rgba(153,27,27,.3);
}
.profile-head h2{font-size:18px;color:var(--text-strong);margin-bottom:4px}
.profile-head .username{font-size:12px;color:var(--purple-soft);margin-bottom:8px}
.profile-head .bio{
  font-size:12px;color:#b8c4d6;line-height:1.7;
  max-width:340px;margin:0 auto;
}
.profile-btns{display:flex;gap:8px;justify-content:center;margin-top:16px}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;padding:0 14px;margin-bottom:24px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 8px;text-align:center;
}
.stat b{
  display:block;font-size:20px;
  background:var(--grad-soft);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;margin-bottom:4px;
}
.stat span{font-size:11px;color:var(--muted)}

.menu-list{padding:0;margin-bottom:24px}
.menu-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:.2s;
}
.menu-item:hover{
  border-color:rgba(220,38,38,.5);
  background:var(--surface-2);
}
.menu-item .right{
  display:flex;align-items:center;gap:12px;
  font-size:13px;color:var(--text-strong);
}
.menu-item .right .icon{
  width:32px;height:32px;border-radius:8px;
  background:rgba(220,38,38,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
}
.menu-item .arrow{color:var(--muted);font-size:14px}
.menu-item .value{color:var(--purple-soft);font-size:12px}

.menu-item.admin-access{
  background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(220,38,38,.1));
  border:1.5px solid rgba(167,139,250,.5);
}
.menu-item.admin-access .right .icon{
  background:var(--grad);
  color:#fff;
}

.watch-player{
  margin:14px;
  border-radius:14px;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(153,27,27,.15),transparent 60%),
    #050810;
}
.watch-player .play-icon{
  width:80px;height:80px;
  border-radius:50%;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#fff;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(153,27,27,.4);
  transition:.25s;
}
.watch-player .play-icon:hover{
  transform:scale(1.1);
}
.watch-controls{
  display:flex;
  gap:8px;
  padding:0 14px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.control-btn{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 14px;
  font-size:12px;
  color:var(--text-strong);
  cursor:pointer;
  transition:.2s;
  font-family:Tahoma,sans-serif;
}
.control-btn:hover{
  border-color:var(--turquoise);
  background:var(--surface-2);
}

.episode-list{
  padding:0 14px;
  margin-bottom:24px;
}
.episode{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.2s;
}
.episode:hover{
  border-color:rgba(220,38,38,.5);
  background:var(--surface-2);
}
.episode .ep-num{
  width:38px;height:38px;
  border-radius:10px;
  background:var(--grad);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;
  font-size:14px;
  flex-shrink:0;
}
.episode .ep-info{flex:1}
.episode .ep-info b{
  display:block;
  font-size:13px;
  color:var(--text-strong);
  margin-bottom:3px;
}
.episode .ep-info small{
  color:var(--muted);
  font-size:11px;
}
.episode.current{
  border-color:var(--turquoise);
  background:rgba(220,38,38,.06);
}

.empty{
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
}
.empty .icon{
  font-size:50px;
  margin-bottom:14px;
  opacity:.4;
}
.empty h3{
  font-size:15px;
  color:var(--text-strong);
  margin-bottom:6px;
}
.empty p{font-size:12px;line-height:1.7}

/* ============ استایل ادمین ============ */
.admin-login-wrap{
  padding:40px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:60vh;
}
.admin-login-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px 24px;
  max-width:400px;
  width:100%;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.6);
}
.admin-lock{
  font-size:56px;
  margin-bottom:14px;
}
.admin-login-box h2{
  font-size:20px;
  color:var(--text-strong);
  margin-bottom:8px;
}
.admin-login-box .desc{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-bottom:20px;
}
.admin-login-box input{
  width:100%;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  color:var(--text-strong);
  font-size:16px;
  outline:none;
  text-align:center;
  font-family:Tahoma,sans-serif;
  letter-spacing:3px;
  transition:.2s;
}
.admin-login-box input:focus{
  border-color:var(--turquoise);
  box-shadow:0 0 0 4px rgba(220,38,38,.15);
}
.admin-error{
  color:#f87171;
  font-size:13px;
  margin-top:12px;
  min-height:18px;
  font-weight:bold;
}
.admin-hint{
  font-size:11px;
  color:var(--muted);
  margin-top:16px;
}
.admin-hint b{
  color:var(--turquoise-soft);
  background:rgba(220,38,38,.1);
  padding:3px 10px;
  border-radius:6px;
  letter-spacing:1px;
}

.admin-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:0 14px;
  margin-bottom:20px;
}
.admin-stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 6px;
  text-align:center;
  transition:.2s;
}
.admin-stat:hover{
  border-color:rgba(220,38,38,.5);
  transform:translateY(-3px);
}
.admin-stat-icon{font-size:22px;margin-bottom:6px}
.admin-stat b{
  display:block;font-size:17px;
  background:var(--grad-soft);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;margin-bottom:2px;
}
.admin-stat span{font-size:10px;color:var(--muted)}

.admin-tabs{
  display:flex;gap:6px;
  padding:0 14px;
  margin-bottom:16px;
  overflow-x:auto;
  scrollbar-width:none;
}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--muted);
  padding:9px 16px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
  font-family:Tahoma,sans-serif;
}
.admin-tab.active{
  background:var(--grad);
  color:#fff;
  border-color:transparent;
  box-shadow:0 4px 14px rgba(124,58,237,.4);
}
.admin-content{display:none}
.admin-content.active{display:block}

.admin-chart{
  display:flex;align-items:flex-end;justify-content:space-around;
  height:180px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 10px 26px;
  gap:8px;
}
.admin-chart .bar{
  flex:1;background:var(--grad);
  border-radius:8px 8px 0 0;
  position:relative;transition:.3s;
  min-height:10px;opacity:.85;
}
.admin-chart .bar:hover{opacity:1}
.admin-chart .bar span{
  position:absolute;bottom:-22px;left:50%;
  transform:translateX(-50%);
  font-size:11px;color:var(--muted);
}

.admin-activity{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}
.activity-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.activity-item:last-child{border-bottom:none}
.activity-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--grad);flex-shrink:0;
  box-shadow:0 0 10px rgba(220,38,38,.6);
}
.activity-info{flex:1}
.activity-info b{
  display:block;font-size:13px;
  color:var(--text-strong);margin-bottom:3px;
}
.activity-info small{font-size:11px;color:var(--muted)}

.admin-list{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}
.admin-list-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
}
.admin-list-item:last-child{border-bottom:none}
.admin-item-thumb{
  width:44px;height:58px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;color:#fff;
}
.admin-item-thumb.user-thumb{
  height:44px;width:44px;border-radius:50%;
  background:var(--grad);
}
.admin-item-thumb.admin-user{
  background:linear-gradient(135deg,#f59e0b,#dc2626);
}
.admin-item-info{flex:1;min-width:0}
.admin-item-info b{
  display:block;font-size:13px;
  color:var(--text-strong);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.admin-item-info small{font-size:11px;color:var(--muted)}
.admin-item-actions{display:flex;gap:6px;flex-shrink:0}
.admin-btn{
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text-strong);
  padding:8px 11px;border-radius:8px;
  cursor:pointer;font-size:13px;
  transition:.2s;font-family:Tahoma,sans-serif;
}
.admin-btn:hover{
  border-color:var(--turquoise);
  background:var(--surface-2);
}
.admin-btn.delete:hover{border-color:#ef4444;color:#f87171}
.admin-btn.approve{
  color:var(--turquoise-soft);
  font-size:11px;font-weight:bold;
}

.admin-comment{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:10px;
}
.admin-comment.pending{
  border-color:rgba(245,158,11,.4);
  background:linear-gradient(135deg,rgba(245,158,11,.05),var(--surface));
}
.admin-comment-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:8px;
  flex-wrap:wrap;gap:6px;
}
.admin-comment-head b{font-size:13px;color:var(--turquoise-soft)}
.admin-comment-head small{font-size:10px;color:var(--muted)}
.admin-comment p{
  font-size:12px;color:#c2cbdb;
  line-height:1.7;margin-bottom:10px;
}

footer{
  background:rgba(11,18,32,.9);
  padding:20px;text-align:center;
  color:var(--muted);font-size:11px;
  border-top:1px solid var(--border);
  margin-top:20px;
}
footer b{
  font-size:16px;display:block;margin-bottom:6px;
  background:var(--grad-soft);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}

.bottom-nav{
  position:fixed;bottom:0;right:0;left:0;
  background:rgba(11,18,32,.95);
  backdrop-filter:blur(10px);
  display:flex;justify-content:space-around;
  padding:8px 0;
  border-top:1px solid var(--border);
  box-shadow:0 -2px 14px rgba(0,0,0,.5);
  z-index:20;
}
.bottom-nav div{
  text-align:center;
  font-size:9px;
  color:var(--muted);
  cursor:pointer;
  padding:4px 8px;
  border-radius:10px;
  transition:.2s;
}
.bottom-nav div.active{
  color:var(--turquoise);
  font-weight:bold;
  background:rgba(220,38,38,.08);
}
.bottom-nav span{
  display:block;font-size:20px;margin-bottom:2px;
}
